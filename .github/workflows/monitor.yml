name: OI Monitor

# Schedule: 6 run/giorno, uno ~5 min dopo OGNI chiusura di candela 4h (UTC).
# Le candele 4h chiudono alle 00/04/08/12/16/20 UTC: analizzare piu' spesso e'
# inutile (stesso dato della candela). Cosi' ogni candela e' analizzata una volta
# con dato fresco/confermato, si consuma 1/4 dei minuti del cron orario, e il resto
# lo decide l'utente col run manuale (workflow_dispatch) quando c'e' una notizia.
# Orari IT (estate, UTC+2): 02:05 06:05 10:05 14:05 18:05 22:05.
on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:  # permette di lanciarlo manualmente dal tab Actions

permissions:
  contents: write  # necessario per committare state.json e history.json

# Evita run concorrenti che potrebbero corrompere lo state
concurrency:
  group: oi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run OI Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python oi_monitor.py

      - name: Commit state & history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          [ -f history.json ] && git add history.json
          [ -f performance.json ] && git add performance.json
          if ! git diff --cached --quiet; then
            git commit -m "State $(date -u +%Y-%m-%d_%H-%M)"
            # pull --rebase prima del push: evita di perdere history/performance se
            # un altro run ha già pushato (cron orario -> run ravvicinati). Senza
            # questo, il push falliva e lo storico veniva perso (bug pre-luglio).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push $i fallito, retry..."; sleep 5
            done
          else
            echo "No state changes to commit"
          fi

      - name: Mirror data files to public repo
        env:
          OI_DATA_TOKEN: ${{ secrets.OI_DATA_TOKEN }}
        run: |
          if [ -z "$OI_DATA_TOKEN" ]; then
            echo "OI_DATA_TOKEN non configurato, skip mirror"
            exit 0
          fi
          cd /tmp
          git clone https://x-access-token:${OI_DATA_TOKEN}@github.com/Clago85/clago_oi_data.git public_data
          cd public_data
          cp "$GITHUB_WORKSPACE/state.json"   . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/history.json" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/performance.json" . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json history.json performance.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync data $(date -u +%Y-%m-%d_%H-%M)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push mirror $i fallito, retry..."; sleep 5
            done
            echo "Mirror su clago_oi_data: OK"
          else
            echo "Mirror: nessuna modifica"
          fi

      - name: Wait CDN propagation
        run: sleep 30

      - name: Send pending Telegram alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_alerts.py
