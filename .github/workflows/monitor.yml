name: OI Monitor

# Schedule: ogni ora al minuto 5 (UTC). I 5 min danno tempo agli exchange di pubblicare
# i dati orari freschi dopo la chiusura della candela 1h. Cambia il cron se vuoi
# cadenza diversa (es. '0 */2 * * *' = ogni 2h, '0,30 * * * *' = ogni 30 min).
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:  # permette di lanciarlo manualmente dal tab Actions

permissions:
  contents: write  # necessario per committare state.json e history.json

# Evita run concorrenti che potrebbero corrompere lo state
concurrency:
  group: oi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run OI Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python oi_monitor.py

      - name: Commit state & history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          [ -f history.json ] && git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "State $(date -u +%Y-%m-%d_%H-%M)"
            git push
          else
            echo "No state changes to commit"
          fi
